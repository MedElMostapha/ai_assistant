name: amanah
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+psycopg://judge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/judge
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://storage:8333
    S3_BUCKET: judge-private
    S3_ACCESS_KEY: amanah
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  restart: unless-stopped
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: judge
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U judge -d judge']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.48
    command: [mini, -dir=/data, -ip.bind=0.0.0.0]
    environment:
      AWS_ACCESS_KEY_ID: amanah
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: judge-private
    volumes: [storage-data:/data]
    restart: unless-stopped
  init:
    <<: *backend
    restart: 'no'
    command: [sh, -c, 'flask --app app db upgrade && flask --app app init-storage']
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
  api:
    <<: *backend
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:5000/api/health")']
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [celery, -A, app.jobs.celery, worker, --loglevel=WARNING, --concurrency=2]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  storage-data:
